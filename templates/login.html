{% extends 'base.html' %}

{% block title %}Login - Smart Event Management System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="custom-card p-4 p-sm-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex p-3 mb-2">
                        <i class="bi bi-person-lock fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Portal Login</h4>
                    <p class="text-muted small">Sign in as a Student or Administrator</p>
                </div>

                <!-- One-click Demo Credentials for College Examiner Presentation -->
                <div class="bg-light p-3 rounded-3 border mb-4">
                    <small class="text-muted fw-bold d-block mb-2">
                        <i class="bi bi-key-fill text-primary"></i> Demo Credentials (Click to auto-fill):
                    </small>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary btn-sm flex-grow-1" onclick="fillDemo('student')">
                            <i class="bi bi-mortarboard"></i> Student
                        </button>
                        <button type="button" class="btn btn-outline-dark btn-sm flex-grow-1" onclick="fillDemo('admin')">
                            <i class="bi bi-shield-lock"></i> Admin
                        </button>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-bold text-dark">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold text-dark">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-4 small text-muted border-top pt-3">
                    Don't have an account yet? 
                    <a href="{{ url_for('register') }}" class="fw-bold text-primary text-decoration-none">Register as Student</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
