{% extends 'base.html' %}

{% block title %}Edit Event - Smart Event Management System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="custom-card p-4 p-sm-5">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h4 class="fw-bold text-dark mb-0">Modify Event Details</h4>
                        <small class="text-muted">Update schedule, venue, or capacity for this event</small>
                    </div>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                    </a>
                </div>

                <form method="POST" action="{{ url_for('edit_event', event_id=event['id']) }}">
                    <div class="mb-3">
                        <label for="title" class="form-label small fw-bold text-dark">Event Title *</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ event['title'] }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="category" class="form-label small fw-bold text-dark">Category *</label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in ['Technical', 'Cultural', 'Sports', 'Technical Seminar', 'Exhibition', 'Workshop'] %}
                                    <option value="{{ cat }}" {% if event['category'] == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label for="max_participants" class="form-label small fw-bold text-dark">Max Participants Limit</label>
                            <input type="number" class="form-control" id="max_participants" name="max_participants" value="{{ event['max_participants'] }}" min="10">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="date" class="form-label small fw-bold text-dark">Event Date *</label>
                            <input type="date" class="form-control" id="date" name="date" value="{{ event['date'] }}" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="time" class="form-label small fw-bold text-dark">Event Time Slot *</label>
                            <input type="text" class="form-control" id="time" name="time" value="{{ event['time'] }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="venue" class="form-label small fw-bold text-dark">Event Venue *</label>
                        <input type="text" class="form-control" id="venue" name="venue" value="{{ event['venue'] }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="coordinator" class="form-label small fw-bold text-dark">Faculty Coordinator Name *</label>
                            <input type="text" class="form-control" id="coordinator" name="coordinator" value="{{ event['coordinator'] }}" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="coordinator_phone" class="form-label small fw-bold text-dark">Coordinator Contact Number</label>
                            <input type="tel" class="form-control" id="coordinator_phone" name="coordinator_phone" value="{{ event['coordinator_phone'] or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="image_url" class="form-label small fw-bold text-dark">Cover Image URL</label>
                        <input type="url" class="form-control" id="image_url" name="image_url" value="{{ event['image_url'] or '' }}">
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label small fw-bold text-dark">Detailed Description & Rules *</label>
                        <textarea class="form-control" id="description" name="description" rows="4" required>{{ event['description'] }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">
                            <i class="bi bi-save me-1"></i> Update Event
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
